name: Build and Deploy to Hostinger

# Deployment remains manual-only until Orbit's Hostinger document root,
# FTP_SERVER_DIR, rollback backup and real live marker check are verified.
# This prevents unrelated main-branch changes from uploading into an unknown path.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, deploy, verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Stamp production build identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; import { initialData } from './src/data/initialData.js'; const m = {commit: process.env.GITHUB_SHA, productCount: initialData.products.length, catalogVersion: initialData.catalogVersion, builtAt: new Date().toISOString()}; writeFileSync('dist/deployment.json', JSON.stringify(m, null, 2)); console.log('Release marker:', m);"

      - name: Deploy to Hostinger over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          port: 21
          security: loose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verify exact live commit and catalog
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if live_json="$(curl --fail --silent --show-error --location --max-time 18 --header 'Cache-Control: no-cache' "https://orbit-lubricants.com/deployment.json?commit=${GITHUB_SHA}&attempt=${attempt}")"; then
              if LIVE_JSON="$live_json" node --input-type=module -e 'import { initialData } from "./src/data/initialData.js"; let m; try { m = JSON.parse(process.env.LIVE_JSON); } catch { process.exit(1); } if (m.commit !== process.env.GITHUB_SHA || m.productCount !== initialData.products.length) { console.error("Live build mismatch:", m); process.exit(1); } console.log("Verified live commit and catalog:", m);'; then
                exit 0
              fi
            fi
            echo "Attempt ${attempt}: live site has not served expected build."
            sleep 12
          done
          echo "::error::Deployment verification FAILED. Compare FTP_SERVER_DIR to the website document root in Hostinger."
          exit 1
