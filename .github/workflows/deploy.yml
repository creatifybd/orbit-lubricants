name: 🚀 Build & Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Vite App & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Production Bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📤 Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          port: 21
          security: loose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: ✅ Verify Live Production Build
        shell: bash
        run: |
          set -euo pipefail

          sleep 45

          for attempt in 1 2 3 4 5 6; do
            live_html="$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "https://orbit-lubricants.com/?deploy=${GITHUB_SHA}&attempt=${attempt}")"

            if printf '%s' "$live_html" | grep -q '/src/main.jsx'; then
              echo "Live site is still serving the development entrypoint."
            elif printf '%s' "$live_html" | grep -Eq 'src="/assets/[^"]+\.js"'; then
              curl --fail --silent --show-error \
                --output /dev/null \
                "https://orbit-lubricants.com/images/custom/home-hero-manufacturing.webp?deploy=${GITHUB_SHA}"
              echo "Live production bundle and custom images verified."
              exit 0
            else
              echo "Live production entrypoint is not ready yet."
            fi

            sleep 10
          done

          echo "Live deployment verification failed."
          exit 1
