name: Orbit one-time desktop and mobile browser QA

on:
  push:
    branches: [orbit-enterprise-website-upgrade]
    paths:
      - .github/workflows/browser-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-browser-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    # Playwright 1.56 supports Ubuntu 24.04; runner latest may be Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed staging candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install ephemeral browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1

      - name: Build production bundle
        run: |
          npm run build
          grep -Fq 'justify-content: flex-start;' src/index.css

      - name: Run desktop/mobile browser interactions on local preview only
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/orbit-qa-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/qa-browser.mjs
          test -f qa-screenshots/mobile-home.png
          test -f qa-screenshots/desktop-catalog-comparison.png

      - name: Upload screenshots for independent visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-browser-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 7
