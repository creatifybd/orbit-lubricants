name: Orbit live Search Console owner dashboard availability audit

on:
  push:
    branches: [orbit-live-gsc-dashboard-check]
    paths: [.github/workflows/verify-live-gsc-dashboard.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-live-gsc-owner-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install isolated Playwright driver (Chrome already in runner)
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Check live no-account default and non-tracking behavior
        run: node scripts/verify-live-gsc-dashboard.mjs
