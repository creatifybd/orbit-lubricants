name: Orbit live Search Console owner module HTTP verification

on:
  push:
    branches: [orbit-live-gsc-dashboard-check]
    paths: [.github/workflows/verify-live-gsc-dashboard.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-live-gsc-owner-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check actual public release marker, bundled GSC module, SEO & disabled GA4
        run: node scripts/verify-live-gsc-dashboard.mjs
