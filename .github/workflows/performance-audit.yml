name: Orbit isolated-build Lighthouse performance and accessibility baseline

# This audit runs once when its workflow file is introduced. No cron or
# recurring GitHub Actions use. Purely reads the public Orbit website.
on:
  push:
    branches: [orbit-one-time-performance-audit]
    paths: [.github/workflows/performance-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-one-time-lighthouse-audit
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies and build isolated Orbit production bundle
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Run Lighthouse on local production preview (public server rejected crawler)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-lighthouse
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/orbit-lighthouse-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          npx --yes lighthouse@12.8.2 'http://127.0.0.1:4173/' \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
            --output=json --output-path=qa-lighthouse/home-mobile.json \
            --only-categories=performance,accessibility,best-practices,seo --quiet
          npx --yes lighthouse@12.8.2 'http://127.0.0.1:4173/' \
            --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
            --output=json --output-path=qa-lighthouse/home-desktop.json \
            --only-categories=performance,accessibility,best-practices,seo --quiet
          npx --yes lighthouse@12.8.2 'http://127.0.0.1:4173/products/' \
            --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
            --output=json --output-path=qa-lighthouse/products-mobile.json \
            --only-categories=performance,accessibility,best-practices,seo --quiet
          node scripts/summarize-lighthouse.mjs
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-lighthouse-baseline
          path: qa-lighthouse/
          if-no-files-found: warn
          retention-days: 7
