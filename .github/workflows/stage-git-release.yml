name: Prepare Orbit Git-root static release candidate

# One-time staging task. Only changes to THIS workflow file schedule a run;
# a generated site commit does not trigger this workflow again.
on:
  push:
    branches: [orbit-enterprise-website-upgrade]
    paths:
      - .github/workflows/stage-git-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbit-release-candidate-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare compiled static commit on STAGING branch only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build and strictly verify
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          node scripts/prepare-git-publish.mjs

      - name: Commit only allowlisted published files to staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .htaccess index.html assets products images \
            about contact finder robots.txt sitemap.xml deployment.json seo-manifest.json
          if git diff --cached --name-only --diff-filter=D | grep -q .; then
            echo "::error::Deletion detected. Refusing release candidate."
            exit 1
          fi
          count="$(git diff --cached --name-only | wc -l)"
          echo "Allowed static file additions/updates: $count"
          if [ "$count" -gt 200 ]; then
            echo "::error::Unexpectedly large static diff; review before publication."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Static root already matches the tested build."
            exit 0
          fi
          git commit -m "Stage validated Orbit compiled site for safe Git integration release"
          git push origin HEAD:orbit-enterprise-website-upgrade
          echo "Pushed compiled candidate to STAGING branch only. Production main unchanged."
