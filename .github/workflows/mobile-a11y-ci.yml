name: Orbit post-fix mobile accessibility and hero stability QA

# Bounded, single-trigger validation. No FTP or production mutation.
on:
  push:
    branches: [orbit-mobile-a11y-performance]
    paths: [.github/workflows/mobile-a11y-ci.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-mobile-a11y-release-qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build the updated Orbit site and verify original product assets
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install local Chrome driver (Chrome is already in runner image)
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Run real desktop/mobile product and contact regression
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/orbit-a11y-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/qa-browser.mjs
          mkdir -p qa-lighthouse
          export CHROME_PATH=/usr/bin/google-chrome
          npx --yes lighthouse@12.8.2 'http://127.0.0.1:4173/' --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path=qa-lighthouse/home-mobile.json --only-categories=performance,accessibility,best-practices,seo --quiet
          npx --yes lighthouse@12.8.2 'http://127.0.0.1:4173/' --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path=qa-lighthouse/home-desktop.json --only-categories=performance,accessibility,best-practices,seo --quiet
          npx --yes lighthouse@12.8.2 'http://127.0.0.1:4173/products/' --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path=qa-lighthouse/products-mobile.json --only-categories=performance,accessibility,best-practices,seo --quiet
          node -e "for(const n of ['home-mobile','home-desktop','products-mobile']) {const x=require('./qa-lighthouse/'+n+'.json');console.log(n, Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)])), x.audits['largest-contentful-paint']?.displayValue)}"
      - name: Save screenshots and audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-mobile-a11y-results
          path: |
            qa-lighthouse/
            qa-screenshots/
          if-no-files-found: warn
          retention-days: 7
