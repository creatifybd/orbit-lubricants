name: Orbit read-only LIVE browser smoke QA
on:
  push:
    branches: [orbit-enterprise-website-upgrade]
    paths:
      - .github/workflows/live-browser-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install ephemeral QA runner tools
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify actual live site in Chrome, no form submissions
        run: node scripts/qa-live-browser.mjs
      - name: Keep visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-live-browser-screenshots
          path: live-qa-screenshots/
          if-no-files-found: warn
          retention-days: 7
