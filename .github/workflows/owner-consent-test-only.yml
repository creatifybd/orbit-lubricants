name: Orbit privacy consent smoke QA — test stream only

# Bounded one-off audit. The fake stream ID exists only inside a disposable
# GitHub runner build and is never committed or deployed to Hostinger.
on:
  push:
    branches: [orbit-zero-cost-ga4-owner-dashboard]
    paths: [.github/workflows/owner-consent-test-only.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-owner-consent-test-once
  cancel-in-progress: false

jobs:
  consent:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: Build only on isolated runner with fake stream ID
        env:
          VITE_GA4_MEASUREMENT_ID: G-TEST123456
        run: npm run build
      - name: Install Chrome driver
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify denied/granted/revoked choices in actual Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/orbit-consent-test.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/tests/consent.browser.mjs
          echo "TEST ONLY. No real Orbit GA4 property and no production deployment."
